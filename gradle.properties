# Enable parallel module compilation
org.gradle.parallel=true

# Enable build cache for fast incremental builds
org.gradle.caching=true

# Reuse Gradle daemon configuration
org.gradle.configuration-cache=true

# JVM allocation for Gradle Daemon
org.gradle.jvmargs=-Xmx2048m -XX:+TieredCompilation -XX:TieredStopAtLevel=1