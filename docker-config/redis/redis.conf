# ==========================================
# Network & Security
# ==========================================
bind 0.0.0.0
port 6379
protected-mode yes
requirepass redispassword
timeout 0
tcp-keepalive 300

# ==========================================
# Memory Management
# ==========================================
# Limit memory usage (adjust based on your machine, e.g., 256mb or 512mb)
maxmemory 256mb
# Evict keys using LRU when maxmemory is reached
maxmemory-policy allkeys-lru

# ==========================================
# Persistence (AOF & RDB Snapshots)
# ==========================================
# Snapshot rules: save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

# Append Only File (AOF) for high durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# ==========================================
# Performance & Logging
# ==========================================
loglevel notice
databases 16